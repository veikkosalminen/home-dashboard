<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kodin mittarit</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1f2328; --muted: #6a7078; --line: #e3e0da;
    --ok: #2e7d4f; --bad: #b3261e;
    --c1: #2f6fb0; --c2: #d0782a; --c3: #5a9a5a; --c4: #8a5bb0; --c5: #8a8f96;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --card: #1e2125; --ink: #e8e6e3; --muted: #9aa0a8; --line: #2e3238;
      --ok: #6cc28c; --bad: #ef7a72;
      --c1: #6ea8e6; --c2: #f0a060; --c3: #8cc68c; --c4: #b994e0; --c5: #a0a6ae;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 22px; margin: 0; }
  .stamp { color: var(--muted); font-size: 13px; }
  .stamp.old { color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
             color: var(--muted); margin: 0 0 10px; }
  .big { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .big small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .rows { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: tabular-nums; }
  .rows span:nth-child(odd) { color: var(--muted); }
  .rows span:nth-child(even) { text-align: right; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; margin: 8px 6px 0 0; }
  .badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .badge.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 12px; margin-top: 12px; }
  svg { width: 100%; height: 190px; display: block; }
  svg text { fill: var(--muted); font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .err { color: var(--bad); margin-top: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kodin mittarit</h1>
    <span class="stamp" id="stamp">Ladataan…</span>
  </header>
  <div class="grid" id="cards"></div>
  <div class="charts" id="charts"></div>
  <p class="err" id="err" hidden></p>
</main>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (x, d = 1) => x == null ? "–" : Number(x).toLocaleString("fi-FI", { minimumFractionDigits: d, maximumFractionDigits: d });

function card(title, bigVal, bigUnit, rows, badges = "") {
  return `<section class="card"><h2>${title}</h2>
    <div class="big">${bigVal}<small>${bigUnit}</small></div>
    <div class="rows">${rows.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("")}</div>${badges}</section>`;
}

// Line chart of 48 h series as inline SVG; lines = [[seriesKey, label, colourVar], ...]
function chart(title, data, lines, unit, digits = 1) {
  const W = 600, H = 190, L = 34, R = 8, T = 8, B = 20;
  const n = data.series[lines[0][0]].length;
  const all = lines.flatMap(([k]) => data.series[k] || []).filter(v => v != null);
  if (!all.length) return "";
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const x = i => L + (W - L - R) * i / (n - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}"/>`;
    g += `<text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${fmt(v, hi - lo < 4 ? 1 : 0)}</text>`;
  }
  const start = new Date(data.start).getTime(), step = data.step_min * 60000;
  for (let i = 0; i < n; i++) {
    const t = new Date(start + i * step);
    if (t.getMinutes() < data.step_min && t.getHours() % 12 === 0) {
      g += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}" stroke="${css("--line")}"/>`;
      const lab = t.getHours() === 0 ? t.toLocaleDateString("fi-FI", { day: "numeric", month: "numeric" }) : "12";
      g += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle">${lab}</text>`;
    }
  }
  for (const [k, , col] of lines) {
    let d = "", pen = false;
    (data.series[k] || []).forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true;
    });
    g += `<path d="${d}" fill="none" stroke="${css(col)}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }
  const legend = lines.map(([k, name, col]) => {
    const s = (data.series[k] || []).filter(v => v != null);
    return `<span><i style="background:${css(col)}"></i>${name} ${s.length ? fmt(s[s.length - 1], digits) + " " + unit : ""}</span>`;
  }).join("");
  return `<section class="card"><h2>${title} · 48 h</h2><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg><div class="legend">${legend}</div></section>`;
}

function render(d) {
  const v = k => d.now[k]?.v;
  const age = (Date.now() - new Date(d.updated)) / 60000;
  const st = document.getElementById("stamp");
  st.textContent = "Päivitetty " + new Date(d.updated).toLocaleString("fi-FI", { weekday: "short", hour: "2-digit", minute: "2-digit" })
    + (age > 60 ? " – data on vanhaa" : "");
  st.classList.toggle("old", age > 60);
  const badge = (on, okText, badText) => `<span class="badge ${on ? "bad" : "ok"}">${on ? badText : okText}</span>`;

  document.getElementById("cards").innerHTML = [
    card("Ulkona", fmt(v("out_t")), " °C", [
      ["Kosteus", fmt(v("out_rh"), 0) + " %"], ["Absoluuttinen", fmt(v("out_ah"), 2) + " g/m³"], ["Tuuli", fmt(v("wind")) + " m/s"]]),
    card("Sisällä", fmt(v("hall_t")), " °C", [
      ["Eteinen", fmt(v("hall_rh"), 0) + " %"], ["Martan huone", fmt(v("marta_t")) + " °C · " + fmt(v("marta_rh"), 0) + " %"],
      ["Suihku", fmt(v("shower_t")) + " °C · " + fmt(v("shower_rh"), 0) + " %"],
      ["Absoluuttinen", fmt(v("in_ah"), 2) + " g/m³"], ["Kosteustavoite", fmt(v("rh_target"), 0) + " %"]]),
    card("Yläpohja", fmt(v("attic_t")), " °C", [
      ["Kosteus", fmt(v("attic_rh"), 0) + " %"], ["Kastepiste", fmt(v("attic_dew")) + " °C"],
      ["Absoluuttinen", fmt(v("attic_ah"), 2) + " g/m³"], ["Ero ulkoilmaan", fmt(v("attic_excess"), 2) + " g/m³"]],
      badge(v("attic_mould"), "Ei homeriskiä", "Homeelle suotuisa") + badge(v("attic_leak"), "Ei sisäilmavuotoa", "Sisäilmaa vuotaa")),
    card("Ilmanvaihto", fmt(v("fan_w"), 0), " W", [
      ["Duty-cycle", fmt(v("fan_duty"), 0) + " %"], ["Päällä tänään", fmt(v("fan_on_pct"), 0) + " %"],
      ["Tarve", fmt(v("need"), 0) + " m³/h"], ["Sähkö tänään", fmt(v("fan_kwh"), 2) + " kWh"]]),
    card("Lämmitys", fmt((v("hp_w") || 0) + (v("rad_w") || 0) + (v("oil_w") || 0), 0), " W", [
      ["Ilmalämpöpumppu", fmt(v("hp_w"), 0) + " W · " + fmt(v("hp_kwh"), 1) + " kWh"],
      ["Patterit", fmt(v("rad_w"), 0) + " W · " + fmt(v("rad_kwh"), 1) + " kWh"],
      ["Öljypoltin", fmt(v("oil_w"), 0) + " W · " + fmt(v("oil_kwh"), 1) + " kWh"]]),
  ].join("");

  document.getElementById("charts").innerHTML = [
    chart("Lämpötila", d, [["out_t", "Ulkona", "--c5"], ["hall_t", "Eteinen", "--c2"], ["marta_t", "Martan huone", "--c4"],
                           ["shower_t", "Suihku", "--c1"], ["attic_t", "Yläpohja", "--c3"]], "°C"),
    chart("Suhteellinen kosteus", d, [["out_rh", "Ulkona", "--c5"], ["hall_rh", "Eteinen", "--c2"], ["marta_rh", "Martan huone", "--c4"],
                                      ["shower_rh", "Suihku", "--c1"], ["attic_rh", "Yläpohja", "--c3"]], "%", 0),
    chart("Absoluuttinen kosteus", d, [["out_ah", "Ulkona", "--c5"], ["in_ah", "Sisällä", "--c2"], ["attic_ah", "Yläpohja", "--c3"]], "g/m³", 2),
    chart("Sähköteho", d, [["hp_w", "Ilmalämpöpumppu", "--c1"], ["rad_w", "Patterit", "--c2"], ["fan_w", "Poistopuhallin", "--c3"]], "W", 0),
  ].join("");
}

let last;
async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    last = await r.json();
    render(last);
    document.getElementById("err").hidden = true;
  } catch (e) {
    const el = document.getElementById("err");
    el.textContent = "Datan lataus epäonnistui: " + e.message;
    el.hidden = false;
  }
}
load();
setInterval(load, 5 * 60000);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => last && render(last));
</script>
</body>
</html>
